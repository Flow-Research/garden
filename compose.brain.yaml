services:
  helix:
    image: ghcr.io/helixdb/helixdb:v0.0.4
    restart: unless-stopped
    environment:
      # R2 (S3-compatible) object storage. Required vars fail fast so the stack
      # never silently falls back to in-memory mode (data loss on restart).
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET to the R2 bucket name}
      S3_REGION: ${S3_REGION:-auto}
      DB_PATH: ${DB_PATH:-production/}
      AWS_ENDPOINT: ${AWS_ENDPOINT:?set AWS_ENDPOINT to the R2 S3 endpoint URL}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?set AWS_ACCESS_KEY_ID for the R2 token}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?set AWS_SECRET_ACCESS_KEY for the R2 token}

  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - helix
    environment:
      BRAIN_API_SECRET: ${BRAIN_API_SECRET}
    expose:
      - "3000"
    configs:
      - source: brain-caddyfile
        target: /etc/caddy/Caddyfile
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --tries=1
        - --spider
        - http://127.0.0.1:3000/healthz
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

configs:
  brain-caddyfile:
    content: |
      :3000 {
          handle /healthz {
              respond "OK" 200
          }

          @authorized header Authorization "Bearer ${BRAIN_API_SECRET}"

          handle @authorized {
              reverse_proxy helix:8080 {
                  header_up -Authorization
              }
          }

          respond "Unauthorized" 401
      }

