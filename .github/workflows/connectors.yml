name: Connectors

on:
  pull_request:
    paths:
      - 'packages/connectors/**'
      - 'packages/agent-runtime/src/runtime-mcp-controller.ts'
      - 'apps/web/src/lib/server/executor-engine/**'
      - 'apps/web/src/lib/server/executor-runtime.ts'
      - 'apps/web/src/routes/api/executor/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/connectors.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify connector coverage
        run: pnpm verify:connectors

      - name: Typecheck connector package
        run: pnpm --filter @garden/connectors typecheck

      - name: Test connector package
        run: pnpm --filter @garden/connectors test
