name: Connectors

on:
  pull_request:
    paths:
      - 'connectors/**'
      - 'packages/create-garden-connector/**'
      - 'scripts/verify-connector-coverage.ts'
      - '.github/workflows/connectors.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify connector coverage
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          GITHUB_MCP_BEARER_TOKEN: ${{ secrets.GITHUB_MCP_BEARER_TOKEN }}
          SLACK_MCP_BEARER_TOKEN: ${{ secrets.SLACK_MCP_BEARER_TOKEN }}
        run: pnpm verify:connectors

      - name: Typecheck connector packages
        run: |
          pnpm --filter @garden/connectors typecheck
          pnpm --filter create-garden-connector typecheck

      - name: Test connector packages
        run: |
          pnpm --filter @garden/connectors test
          pnpm --filter create-garden-connector test
