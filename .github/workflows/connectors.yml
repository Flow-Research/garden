name: Connectors

on:
  pull_request:
    paths:
      - 'packages/connectors/**'
      - 'packages/agent-runtime/src/runtime-mcp-controller.ts'
      - 'apps/web/src/lib/server/executor-engine/**'
      - 'apps/web/src/lib/server/executor-runtime.ts'
      - 'apps/web/src/routes/api/executor/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/connectors.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify connector coverage
        env:
          SLACK_MCP_BEARER_TOKEN: ${{ secrets.SLACK_MCP_BEARER_TOKEN }}
        run: pnpm verify:connectors

      - name: Typecheck connector package
        run: pnpm --filter @garden/connectors typecheck

      - name: Test connector package
        run: pnpm --filter @garden/connectors test
