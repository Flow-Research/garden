# Local development services — never deployed.
#
# `pnpm offline:up` boots Postgres for local dev (the recommended database for
# ALL local development — a fresh, private DB that `pnpm --filter @garden/db
# db:migrate` can own; Neon is for staging/deploys). Port 15432 avoids
# colliding with any system Postgres on 5432.
#
# `pnpm offline:up:ollama` additionally starts Ollama for offline mode
# (`pnpm dev:offline`), serving the default local model on 11434. Skip the
# profile if you run Ollama natively.
services:
  postgres:
    image: postgres:16-alpine
    ports:
      - '15432:5432'
    environment:
      POSTGRES_USER: garden
      POSTGRES_PASSWORD: garden
      POSTGRES_DB: garden
    volumes:
      - garden-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U garden -d garden']
      interval: 2s
      timeout: 3s
      retries: 15

  ollama:
    image: ollama/ollama
    profiles: [ollama]
    ports:
      - '11434:11434'
    volumes:
      - garden-ollama-data:/root/.ollama

volumes:
  garden-postgres-data:
  garden-ollama-data:
